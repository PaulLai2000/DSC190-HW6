[project]
name = "nldate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Paul Lai", email = "paul262935@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dateparser>=1.5.0",
    "python-dateutil>=4.0.0",
]

[project.scripts]
nldate = "nldate:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "types-python-dateutil>=2.9.0.20261104",
]
